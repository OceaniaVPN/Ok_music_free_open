name = "ok-music-free-open"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
APP_NAME = "Ok Music"
JAMENDO_CLIENT_ID = "84646146"
VK_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

[build]
command = "node scripts/build-local-music.mjs"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "AUTH_CODES"
class_name = "AuthCodesV2"

[[migrations]]
tag = "auth-codes-v2"
new_sqlite_classes = ["AuthCodesV2"]
