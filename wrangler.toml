name = "ok-music-free-open"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
APP_NAME = "Ok Music"
JAMENDO_CLIENT_ID = "84646146"
VK_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
TELEGRAM_WEBAPP_URL = "https://ok-music-free-open.workers.dev"

[build]
command = "node scripts/build-local-music.mjs"

[assets]
directory = "./public"
binding = "ASSETS"

[exports.AuthCodes]
type = "durable-object"
state = "deleted"


[exports.AuthCodesV2]
type = "durable-object"
state = "deleted"

[[services]]
binding = "HITMOZ_PYTHON"
service = "ok-music-free-open-hitmoz"
