name: Temporary JS check
on:
  push:
    branches: ["main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check src/index.js
      - run: node --check src/api/index.js
      - run: node --check src/api/mega-local.js
      - run: node --check public/sw.js
      - run: |
          node <<'NODE'
          const fs=require("fs");
          const s=fs.readFileSync("src/web/app.js","utf8");
          const a=s.indexOf("<script>"),b=s.lastIndexOf("</script>");
          new Function(s.slice(a+8,b));
          if(!s.includes("function playableAudio")) throw Error("playableAudio missing");
          if(!s.includes("t.zaycevId")) throw Error("Zaycev mapping missing");
          console.log("app runtime OK");
          NODE
