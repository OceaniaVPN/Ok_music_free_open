name: Temporary JS check
on:
  push:
    branches: ["main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check src/index.js
      - run: node --check src/api/index.js
      - run: node --check src/api/mega-local.js
      - run: node --check public/sw.js
      - run: |
          node <<'NODE'
          const fs=require("fs");
          const s=fs.readFileSync("src/web/app.js","utf8");
          const a=s.indexOf("<script>"),b=s.lastIndexOf("</script>");
          if(a<0||b<=a) throw Error("script missing");
          new Function(s.slice(a+8,b));
          for(const x of ["function updateSpatial3d","data-spatial3d","Zaycev.net","Jamendo","🔐 Ключник"]) if(!s.includes(x)&&x!=="Zaycev.net") throw Error("missing "+x);
          console.log("runtime syntax OK");
          NODE
